name: Nix Reproducibility

on:
  push:
  pull_request:

jobs:
  build-a:
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.hash.outputs.value }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21

      - name: Build Docker image
        run: nix build .#docker

      - name: Verify QuickNotes binary hash
        run: |
          nix build .#quicknotes --out-link quicknotes-result
          nix-store --query --hash "$(readlink quicknotes-result)"

      - name: Test Docker container
        run: |
          docker load < result
          docker run -d --name quicknotes-test -p 8080:8080 quicknotes:nix
          sleep 5
          echo "=== Container status ==="
          docker ps -a
          echo "=== Container logs ==="
          docker logs quicknotes-test
          echo "=== Health check ==="
          curl -i http://localhost:8080/health

      - name: Measure Nix image size
        run: |
          echo "Nix image archive:"
          du -hL result
          echo "Docker image size:"
          docker image inspect quicknotes:nix --format '{{.Size}} bytes'
          echo "Nix archive SHA-256:"
          sha256sum result

      - name: Compare Dockerfile builds
        run: |
          echo "=== Dockerfile build #1 ==="
          docker build --no-cache -t quicknotes:classic-1 ./app
          docker image inspect quicknotes:classic-1 \
            --format 'Size: {{.Size}} bytes; ID: {{.Id}}'

          echo "=== Dockerfile build #2 ==="
          docker build --no-cache -t quicknotes:classic-2 ./app
          docker image inspect quicknotes:classic-2 \
            --format 'Size: {{.Size}} bytes; ID: {{.Id}}'

          echo "=== Nix image ==="
          docker image inspect quicknotes:nix \
            --format 'Size: {{.Size}} bytes; ID: {{.Id}}'

          echo "=== Full image IDs ==="
          docker images --no-trunc

      - name: Calculate SHA-256
        id: hash
        run: echo "value=$(sha256sum result | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  build-b:
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.hash.outputs.value }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21

      - name: Build Docker image
        run: nix build .#docker

      - name: Verify QuickNotes binary hash
        run: |
          nix build .#quicknotes --out-link quicknotes-result
          nix-store --query --hash "$(readlink quicknotes-result)"

      - name: Calculate SHA-256
        id: hash
        run: echo "value=$(sha256sum result | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  compare:
    needs: [build-a, build-b]
    runs-on: ubuntu-latest
    steps:
      - name: Compare hashes
        env:
          HASH_A: ${{ needs.build-a.outputs.hash }}
          HASH_B: ${{ needs.build-b.outputs.hash }}
        run: |
          echo "Build A: $HASH_A"
          echo "Build B: $HASH_B"
          test -n "$HASH_A"
          test "$HASH_A" = "$HASH_B"
