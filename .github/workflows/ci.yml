name: CI

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false

jobs:
  vet:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.23", "1.24"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: app/go.mod

      - name: Run go vet
        working-directory: app
        run: go vet ./...

  test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.23", "1.24"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: app/go.mod

      - name: Run tests
        working-directory: app
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check whether lint is needed
        id: lint-check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          CHANGED_FILES="$(git diff --name-only "$BASE" "${{ github.sha }}")"

          echo "Changed files:"
          echo "$CHANGED_FILES"

          NON_DOC_FILES="$(echo "$CHANGED_FILES" | grep -Ev '\.md$' || true)"

          if [ -z "$NON_DOC_FILES" ]; then
            echo "run_lint=false" >> "$GITHUB_OUTPUT"
            echo "Only Markdown documentation changed — skipping lint."
          else
            echo "run_lint=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.lint-check.outputs.run_lint == 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: app/go.mod

      - name: Run golangci-lint
        if: steps.lint-check.outputs.run_lint == 'true'
        uses: golangci/golangci-lint-action@7119f3d5ddced62a10a044847a6c6bb0f7a5e76a # v7.0.0
        with:
          version: v2.5.0
          working-directory: app