name: Lab 12 - Build WASM

on:
  push:
    branches:
      - feature/lab12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install TinyGo
        run: |
          wget -q https://github.com/tinygo-org/tinygo/releases/download/v0.43.0/tinygo_0.43.0_amd64.deb
          sudo dpkg -i tinygo_0.43.0_amd64.deb
          tinygo version

      - name: Install Spin CLI
        run: |
          curl -fsSL https://developer.fermyon.com/downloads/install.sh | bash
          chmod +x ./spin
          ./spin --version

      - name: Build WebAssembly
        working-directory: wasm/moscow-time
        run: |
          go version
          tinygo version
          tinygo env GOVERSION
          go mod download
          "$GITHUB_WORKSPACE/spin" build
          ls -lh main.wasm

      - name: Test HTTP endpoint
        working-directory: wasm/moscow-time
        run: |
          "$GITHUB_WORKSPACE/spin" up --listen 127.0.0.1:3000 > spin.log 2>&1 &
          sleep 5
          cat spin.log
          curl -i --fail http://127.0.0.1:3000/time

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab12-moscow-time-wasm
          path: wasm/moscow-time/main.wasm