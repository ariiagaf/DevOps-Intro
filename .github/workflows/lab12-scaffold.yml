name: Lab 12 - Build WASM

on:
  push:
    branches:
      - feature/lab12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install TinyGo
        run: |
          wget -q https://github.com/tinygo-org/tinygo/releases/download/v0.41.0/tinygo_0.41.0_amd64.deb
          sudo dpkg -i tinygo_0.41.0_amd64.deb
          tinygo version

      - name: Install Spin CLI
        run: |
          curl -fsSL https://developer.fermyon.com/downloads/install.sh | bash
          chmod +x ./spin
          ./spin --version

      - name: Build WebAssembly
        working-directory: wasm/moscow-time
        run: |
          go mod download
          "$GITHUB_WORKSPACE/spin" build
          ls -lh main.wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab12-moscow-time-wasm
          path: wasm/moscow-time/main.wasm