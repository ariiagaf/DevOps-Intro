
name: Lab 12 - Spin Scaffold

on:
  push:
    branches:
      - feature/lab12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Spin CLI
        run: |
          curl -fsSL https://developer.fermyon.com/downloads/install.sh | bash
          chmod +x ./spin
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Check Spin installation
        run: |
          echo "HOME=$HOME"
          find "$HOME" -type f -name spin 2>/dev/null | head -20
          command -v spin || true
          ls -la "$HOME/.spin/bin" 2>/dev/null || true
          ls -lh ./spin
          file ./spin

      - name: Generate Go HTTP template
        run: |
          "$GITHUB_WORKSPACE/spin" --version
          "$GITHUB_WORKSPACE/spin" templates install --git https://github.com/spinframework/spin
          cd wasm
          "$GITHUB_WORKSPACE/spin" new -t http-go moscow-time --accept-defaults

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: lab12-spin-template
          path: wasm/moscow-time/
          include-hidden-files: true

